name: BB8 validation
on:
  push:
    paths: ['bb8/**', '.agents/**', '.claude/**', 'AGENTS.md', 'CLAUDE.md', '.github/workflows/bb8-check.yml']
  pull_request:
    paths: ['bb8/**', '.agents/**', '.claude/**', 'AGENTS.md', 'CLAUDE.md', '.github/workflows/bb8-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate the BB8 package and host discovery
        run: |
          python bb8/adapters/reference/bb8.py validate
          python bb8/adapters/discovery/sync.py --check
          python -B -m unittest discover -s bb8/tests -p 'test_*.py' -v
