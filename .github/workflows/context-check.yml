name: Product context validation
on:
  push:
    paths: ['context/**', 'scripts/verify-context.py', '.github/workflows/context-check.yml']
  pull_request:
    paths: ['context/**', 'scripts/verify-context.py', '.github/workflows/context-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python scripts/verify-context.py
      - run: node context/design-thinking/data-model/validate.js context/design-thinking/data-model/ledgers
