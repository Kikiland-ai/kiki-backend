name: Screen reader offline acceptance
on:
  pull_request:
    paths: ['prototypes/**', 'contracts/**', 'tests/**', 'scripts/**', 'fixtures/**', 'artifacts/**', '.github/workflows/screen-reader-evaluation.yml']
  push:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Provenance checks verify the candidate's ancestor, not only its files.
          fetch-depth: 0
      # Concept narration WAVs are in Git LFS; cache them so each run does not re-download them.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.gitattributes', 'artifacts/cam-review/recovery-manifest.json') }}
      - run: git lfs pull
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: pip install -r prototypes/screen_capture/requirements.txt
      - run: python scripts/run-screen-reader-evaluation.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: screen-reader-evaluation
          path: work/evaluations/latest/
          retention-days: 14
