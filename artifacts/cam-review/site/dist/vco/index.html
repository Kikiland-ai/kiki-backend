ects a model, never supplies code. */
((root) => {
  'use strict';
  const TAU = 2 * Math.PI;
  const REFERENCE_CYCLES = 8;
  const NORMALIZED_SENSITIVITY = 0.5;
  function sample(t, control, mode) {
    if (!Number.isFinite(t) || !Number.isFinite(control) || t < 0 || t > 1 || Math.abs(control) > 1 || !['hold', 'message'].includes(mode)) {
      throw new Error('Invalid bounded VCO model input.');
    }
    const input = mode === 'hold' ? control : control * Math.sin(TAU * t);
    const ratio = 1 + NORMALIZED_SENSITIVITY * input;
    // Phase is the integral of instantaneous frequency, NOT f(t) * t.
    const phase = mode === 'hold' ? TAU * REFERENCE_CYCLES * ratio * t :
      TAU * REFERENCE_CYCLES * t + REFERENCE_CYCLES * NORMALIZED_SENSITIVITY * control * (1 - Math.cos(TAU * t));
    return {input, ratio, phase, output: Math.sin(phase), amplitude: 1};
  }
  function series(control, mode, count = 1000) {
    return Array.from({length: count + 1}, (_, i) => ({t: i/count, ...sample(i/count, control, mode)}));
  }
  function plotPath(values, key, center, scale, left = 64, width = 870) {
    return values.map((v, i) => `${i ? 'L' : 'M'}${(left+v.t*width).toFixed(2)},${(center-v[key]*scale).toFixed(2)}`).join(' ');
  }
  function mount(host, previous, onInteraction) {
    let mode = previous?.mode || 'message', control = previous?.control ?? 1;
    let compare = previous?.compare || false, progress = 0;
    host.innerHTML = `
      <div class="mechanism-intro"><span class="eyebrow">CHANGE THE INPUT. SEE THE CONSEQUENCE.</span>
      <h3>Voltage changes the spacing, not the height.</h3><p>Follow the same moment on both traces. Closely spaced cycles mean a higher frequency.</p></div>
      <div class="mechanism-tabs" role="group" aria-label="VCO input mode">
        <button type="button" data-mode="message">Follow a message</button><button type="button" data-mode="hold">Hold a voltage</button>
      </div>
      <div class="signal-stage"><svg viewBox="0 0 1000 565" role="img" aria-label="Linked message voltage and VCO output at the same time">
        <defs><marker id="signal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8a9d92"/></marker></defs>

        <path d="M600 42H700" marker-end="url(#signal-arrow)"/><rect x="712" y="16" width="222" height="51" rx="12"/><text x="823" y="48" text-anchor="middle">Frequency changes</text></g>
        <text class="plot-title input-ink" x="64" y="113">CONTROL VOLTAGE · m(t)</text><text class="plot-subtitle" x="934" y="113" text-anchor="end">Normalized input</text>
        <rect class="plot-surface" x="64" y="130" width="870" height="155" rx="8"/>
        <path class="zero-line" d="M64 207.5H934"/><text class="axis-label" x="46" y="214">0</text>
        <path class="input-trace" data-input-path fill="none"/><circle data-input-dot r="7" class="input-dot"/>

        <path class="zero-line" d="M64 429.5H934"/>

        <path class="reference-trace" data-reference-path fill="none"/>
        <path class="output-trace" data-output-path fill="none"/><circle data-output-dot r="7" class="output-dot"/>

        <path class="time-cursor" data-time-cursor d="M64 130V507"/>

      });
      controls.min = mode === 'hold' ? '-1' : '0'; controls.value = control;
