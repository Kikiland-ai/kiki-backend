<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button preview</title></head>
<body class="bb-grid-bg">
<div id="root" class="bb-root" style="padding:16px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start"></div>
<script>
  var B = window.Breadboard, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment,null,
  h(B.Button,{icon:'play_arrow'},'Start lesson'),
  h(B.Button,{variant:'tonal',icon:'volume_up'},'Hear it'),
  h(B.Button,{variant:'text',icon:'map'},'Show me the whole map'),
  h(B.Button,{disabled:true},'Run simulation')));
</script>
</body>
</html>
