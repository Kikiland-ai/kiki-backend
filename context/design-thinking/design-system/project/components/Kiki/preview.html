<!-- @dsCard group="Kiki" height=240 subtitle="Nine states made from four dots" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Kiki preview</title></head>
<body class="bb-grid-bg">
<div id="root" class="bb-root" style="padding:16px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start"></div>
<script>
  var B = window.Breadboard, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment,null,['idle','listening','thinking','speaking','pointing','asking','celebrating','unsure','examiner'].map(function(s){
  return h('div',{key:s,style:{display:'grid',justifyItems:'center',gap:6,width:88}},h(B.Kiki,{state:s,size:64,lead:s==='listening'?'english':undefined}),h('span',{className:'bb-label',style:{color:'var(--pencil)'}},s));
})));
</script>
</body>
</html>
