<!-- @dsCard group="Kiki" height=420 subtitle="Kiki's guide form: eleven states" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>KikiPointer preview</title></head>
<body class="bb-grid-bg">
<div id="root" class="bb-root" style="padding:16px;display:block"></div>
<script>
  var B = window.Breadboard, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div',{style:{display:'grid',gap:20}},
  h('div',{style:{display:'flex',flexWrap:'wrap',gap:14}},['idle','pointing','tapping','dragging','tracing','thinking','asking','listening','celebrating','unsure','waiting'].map(function(s){
    return h('div',{key:s,style:{display:'grid',justifyItems:'center',gap:4,width:96,padding:'10px 0',borderRadius:16,background:'var(--paper-raised)',border:'1px solid var(--line)'}},h(B.KikiPointer,{state:s,size:72,lead:s==='tapping'||s==='waiting'?'lab':undefined}),h('span',{className:'bb-label',style:{color:'var(--pencil)'}},s));
  })),
  h('div',{style:{display:'flex',gap:16,alignItems:'center',flexWrap:'wrap'}},
    h('span',{className:'bb-label',style:{color:'var(--pencil)'}},'Lead dot shows the skill in play:'),
    ['concept','words','english','lab'].map(function(d){ return h('div',{key:d,style:{display:'grid',justifyItems:'center'}},h(B.KikiPointer,{state:'idle',size:56,lead:d}),h('span',{className:'bb-label',style:{color:'var(--pencil)'}},d)); }))));
</script>
</body>
</html>
