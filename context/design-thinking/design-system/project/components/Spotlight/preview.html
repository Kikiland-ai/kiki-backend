<!doctype html>
<html>
<head><meta charset="utf-8"><title>Spotlight preview</title></head>
<body class="bb-grid-bg">
<div id="root" class="bb-root" style="padding:16px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start"></div>
<script>
  var B = window.Breadboard, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(B.Spotlight,{style:{display:'flex',gap:10,flexWrap:'wrap',padding:16,borderRadius:16,background:'var(--scope-glass)'}},
  ['Parts','Wire','Probe'].map(function(t){ return h('span',{key:t,style:{padding:'10px 14px',borderRadius:10,background:'#23303a',color:'#c9d6df',fontSize:14}},t); }),
  h(B.Spotlight.Target,null,h('span',{style:{display:'inline-block',padding:'10px 16px',borderRadius:10,background:'#34a853',color:'#0e1116',fontWeight:600,fontSize:14}},'\u25b6 Run')),
  h('span',{style:{padding:'10px 14px',borderRadius:10,background:'#23303a',color:'#c9d6df',fontSize:14}},'Scope')));
</script>
</body>
</html>
