<!doctype html>
<html>
<head><meta charset="utf-8"><title>VoiceScope preview</title></head>
<body class="bb-grid-bg">
<div id="root" class="bb-root" style="padding:16px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start"></div>

  var B = window.Breadboard, h = React.createElement;

</script>
</body>
</html>
